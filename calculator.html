<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    
    <style>
        *
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body{
            background-color: #b8b8b8;
            height: 100vh;
            width: 100vw;
            display: grid;
            align-items: center;
            justify-content: center;
        }

        .container
        {
            width: 320px;
            height: 570px;
            background-color: #000;
            color: #fff;
            border-radius: 15px;
            border: none;
            /* padding: 5px; */
        }

        .screen
        {
            color: #fff;
            text-align: right;
            padding: 120px 10px 0 0;
            height: 200px;
            /* background-color: rgb(155, 157, 157); */
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }        

        .result
        {
            padding-top: 20px;
        }

        .calculate
        {
            margin: 0 0 -10px 0;
        }

        .result span.output
        {
            font-size: 36px;
        }

        .number{
            color: #fff;
            background: #9c9b9b;
        }

    .buttonpad
    {
        padding: 10px 10px;
        padding-bottom: 0;
        display: grid;
        grid-template-columns: 23% 23% 23% 23%;
        gap: 2px;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #f1b75b;
    }

    button{
        height: 63px;
        width: 63px;
        border-radius: 50%;
        border: none;
        font-size: 16px;
        cursor: pointer;
    }

    #output
    {
        font-size: 52px;
    }

    .highlight
    {
        background-color: #FF9F09;
        color: #fff;
    }

    </style>
</head>
<body>
        <div class="container">
                <div class="screen">
                        <div class="calculate">
                            <span id="calculation"></span>
                            <!-- <input type="number" class="calculation"> -->
                        </div>

                        <div class="result">
                            <span id="output">0</span>
                            <!-- <input type="number" class="output"> -->
                        </div>
                </div>

                <div class="buttonpad">
                    <button class="number">DEL</button>
                    <button class="number" onclick="resetAll()">AC</button>
                    <button class="number" onclick="calc('%')">%</button>
                    <button class="highlight" onclick="calc('/')">/</button>
                    <button class="number" onclick="calc('7')">7</button>
                    <button class="number" onclick="calc('8')">8</button>
                    <button class="number" onclick="calc('9')">9</button>
                    <button class="highlight" onclick="calc('*')">X</button>
                    <button class="number" onclick="calc('4')">4</button>
                    <button class="number" onclick="calc('5')">5</button>
                    <button class="number" onclick="calc('6')">6</button>

                    <button class="highlight" onclick="calc('-')">-</button>
                    <button class="number" onclick="calc('1')">1</button>
                    <button class="number" onclick="calc('2')">2</button>
                    <button class="number" onclick="calc('3')">3</button>
                    <button class="highlight" onclick="calc('+')">+</button>


                    <button class="number" onclick="calc('+/-')">+/-</button>
                    <button class="number" onclick="calc('0')">0</button>
                    <button class="number" onclick="calc('.')">.</button>
                    <button class="highlight" onclick="getResult()">=</button>
                </div>
        </div>

        <script>
                let exp = "0"
                const output = document.getElementById('output')

                function calc(value){
                   exp = exp === "0" ? value : exp + value
            
                   console.log(exp)
                   output.innerText = exp
                }

                function resetAll()
                {
                    exp = "0"
                    output.innerText = exp
                }

                function getResult()
                {
                    try{
                        result = eval(exp)
                        output.innerText = result
                        exp = "0"
                    }
                    catch(error)
                    {
                        output.innerText = "ERROR"
                    }
                }

        </script>
</body>
</html>
