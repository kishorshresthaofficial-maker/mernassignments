<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Counter</title>
    <style>
        .container
        {
            width: 40vh;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            border: 3px solid #333;
        }

        h2{
            font-size:100px;
        }

        .buttons
        {
            position: relative;
            top: 45px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            
        }

        .buttons button
        {
            background-color: #3515d3;
            color: #fff;
            padding: 10px;
            width: 100px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
    <script>
            let count = 0;

            function countIncrease()
            {
                count++;
                document.getElementById('count').innerText = count;
            }

            function countDecrease()
            {
                count--;
                document.getElementById('count').innerText = count;
            }

            function countReset()
            {
               count = 0;
               document.getElementById('count').innerText = count;
            }
    </script>
</head>
<body>

    <div class="container">
            <h2 id="count">0</h2>
        <div class="buttons">
            <button id="decrease" class="decrease" onclick="countDecrease()">Decrease</button>
            <button id="reset" class="reset" onclick="countReset()">Reset</button>
            <button id="increase" class="increase" onclick="countIncrease()">Increase</button>
        </div>
    </div>
</body>
</html>
